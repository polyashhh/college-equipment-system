services:
  db:
    image: postgres:15-alpine
    container_name: college_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: college_equipment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  adminer:
    image: adminer
    container_name: college_adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  postgres_data: